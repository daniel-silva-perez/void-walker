<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoScape — Audio-Reactive 3D Void Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050510;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    }

    canvas { display: block; }

    /* Scanline overlay */
    #scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      z-index: 10;
    }

    /* Intro overlay */
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    #intro.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #intro-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a0a2e 0%, #050510 70%);
    }

    #intro-content {
      position: relative;
      text-align: center;
    }

    #intro-icon {
      font-size: 64px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    #intro-title {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #intro-sub {
      font-size: 14px;
      color: #7b2fff;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    #intro-action {
      font-size: 12px;
      color: #00d4ff;
      letter-spacing: 1px;
      opacity: 0.7;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    /* HUD */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #hud.visible { opacity: 1; }

    /* Audio visualizer bars */
    #audio-bars {
      position: absolute;
      bottom: 24px;
      left: 24px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      background: rgba(10, 10, 26, 0.6);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(123, 47, 255, 0.3);
    }

    .bar {
      width: 6px;
      border-radius: 3px;
      transition: height 0.05s ease;
      background: #7b2fff;
    }

    /* Coordinates */
    #coords {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-align: right;
      letter-spacing: 1px;
    }

    #coords div { margin-bottom: 2px; }

    /* Audio mode label */
    #audio-mode {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 11px;
      color: #00d4ff;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    /* Controls hint */
    #controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 1px;
      text-align: right;
    }

    /* Pause overlay */
    #pause {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 16, 0.8);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #pause.visible {
      opacity: 1;
      pointer-events: all;
    }

    #pause-text {
      font-size: 18px;
      color: #fff;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- Intro overlay -->
<div id="intro">
  <div id="intro-bg"></div>
  <div id="intro-content">
    <div id="intro-icon">🎙</div>
    <div id="intro-title">EchoScape</div>
    <div id="intro-sub">audio-reactive void explorer</div>
    <div id="intro-action">click anywhere to begin</div>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="audio-mode">● LIVE</div>
  <div id="coords">
    <div id="coord-x">X: 0</div>
    <div id="coord-y">Y: 0</div>
  </div>
  <div id="audio-bars"></div>
  <div id="controls">WASD move · MOUSE look · ESC pause</div>
</div>

<!-- Pause overlay -->
<div id="pause">
  <div id="pause-text">click to resume</div>
</div>

<!-- Scanlines -->
<div id="scanlines"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ─── Config ────────────────────────────────────────────────────────────────────
const CHUNK_SIZE = 100;
const CHUNK_RES = 48;
const RENDER_DIST = 2;
const CAMERA_HEIGHT = 8;
const MOVE_SPEED = 40;
const HISTORY_LEN = 30;

// Frequency band colors (bass → treble)
const BAND_COLORS = [
  new THREE.Color(0x00d4ff), // sub-bass
  new THREE.Color(0x00d4ff), // bass
  new THREE.Color(0x7b2fff), // low-mid
  new THREE.Color(0x7b2fff), // mid
  new THREE.Color(0xff6b35), // high-mid
  new THREE.Color(0xff6b35), // presence
  new THREE.Color(0xffd700),  // brilliance
  new THREE.Color(0xffffff),  // air
];

const BAND_WEIGHTS = [0.15, 0.2, 0.12, 0.15, 0.15, 0.1, 0.08, 0.05];

// ─── State ─────────────────────────────────────────────────────────────────────
let audioCtx: THREE.AudioContext;
let analyser: THREE.AnalyserNode;
let freqData: Uint8Array;
let audioHistory: number[][] = [];
let isAudioReady = false;

// ─── Three.js core ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x050510);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.012);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, CAMERA_HEIGHT, 0);

const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());

// Movement state
const keys = { w: false, a: false, s: false, d: false };
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

// ─── Terrain chunks ─────────────────────────────────────────────────────────────
interface Chunk {
  mesh: THREE.Mesh;
  gx: number;
  gz: number;
}

const chunks = new Map<string, Chunk>();

function chunkKey(gx: number, gz: number): string {
  return `${gx},${gz}`;
}

function createChunkGeometry(gx: number, gz: number): THREE.BufferGeometry {
  const geo = new THREE.BufferGeometry();
  const verts: number[] = [];
  const colors: number[] = [];
  const indices: number[] = [];

  const step = CHUNK_SIZE / CHUNK_RES;
  const ox = gx * CHUNK_SIZE;
  const oz = gz * CHUNK_SIZE;

  // Pre-fill audioHistory slots if needed
  while (audioHistory.length < BAND_WEIGHTS.length) {
    audioHistory.push(new Array(HISTORY_LEN).fill(0));
  }

  // Compute average amplitudes over history for each band
  const bandAmps = BAND_WEIGHTS.map((_, i) => {
    if (i >= audioHistory.length) return 0;
    return audioHistory[i].reduce((a, b) => a + b, 0) / HISTORY_LEN;
  });

  // Dominant band
  let dominantBand = 0;
  let maxAmp = bandAmps[0];
  for (let i = 1; i < bandAmps.length; i++) {
    if (bandAmps[i] > maxAmp) {
      maxAmp = bandAmps[i];
      dominantBand = i;
    }
  }

  // Altitude scale: louder = taller terrain
  const altScale = 1 + maxAmp * 35;
  // Color tint from dominant band
  const tintColor = BAND_COLORS[dominantBand];
  const brightness = 0.3 + maxAmp * 0.7;

  for (let iz = 0; iz <= CHUNK_RES; iz++) {
    for (let ix = 0; ix <= CHUNK_RES; ix++) {
      const wx = ox + ix * step;
      const wz = oz + iz * step;

      // Simplex-like noise (simple value noise for terrain shape)
      const nx = wx * 0.02;
      const nz = wz * 0.02;
      const noise =
        Math.sin(nx * 1.7 + nz * 0.9) * 0.5 +
        Math.sin(nx * 2.3 - nz * 1.4) * 0.3 +
        Math.sin(nx * 0.8 + nz * 3.1) * 0.2;

      // Height from audio + noise
      const rawAmp = maxAmp * (0.8 + noise * 0.4);
      const height = rawAmp * altScale;

      // Tint based on band mix
      const r = tintColor.r * brightness + (noise * 0.05);
      const g = tintColor.g * brightness + (noise * 0.03);
      const b = tintColor.b * brightness + (noise * 0.08);

      verts.push(wx, height, wz);
      colors.push(Math.min(1, r), Math.min(1, g), Math.min(1, b));
    }
  }

  // Indices for triangles
  for (let iz = 0; iz < CHUNK_RES; iz++) {
    for (let ix = 0; ix < CHUNK_RES; ix++) {
      const a = iz * (CHUNK_RES + 1) + ix;
      const b = a + 1;
      const c = a + (CHUNK_RES + 1);
      const d = c + 1;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function buildChunk(gx: number, gz: number): Chunk {
  const geo = createChunkGeometry(gx, gz);

  // Terrain material with vertex colors and grid lines
  const mat = new THREE.MeshPhongMaterial({
    vertexColors: true,
    shininess: 80,
    specular: new THREE.Color(0x7b2fff),
  });

  const mesh = new THREE.Mesh(geo, mat);

  // Grid lines overlay
  const gridGeo = new THREE.BufferGeometry();
  const gridVerts: number[] = [];
  const step = CHUNK_SIZE / CHUNK_RES;

  const ox = gx * CHUNK_SIZE;
  const oz = gz * CHUNK_SIZE;

  for (let i = 0; i <= CHUNK_RES; i++) {
    // Z lines
    gridVerts.push(ox, 0, oz + i * step, ox + CHUNK_SIZE, 0, oz + i * step);
    // X lines
    gridVerts.push(ox + i * step, 0, oz, ox + i * step, 0, oz + CHUNK_SIZE);
  }

  gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridVerts, 3));
  const gridMat = new THREE.LineBasicMaterial({
    color: 0x7b2fff,
    transparent: true,
    opacity: 0.15,
  });
  const gridMesh = new THREE.LineSegments(gridGeo, gridMat);
  gridMesh.position.y = 0.1;

  scene.add(mesh);
  scene.add(gridMesh);

  return { mesh, gx, gz };
}

function updateChunks(): void {
  const cam = camera.position;
  const cgX = Math.round(cam.x / CHUNK_SIZE);
  const cgZ = Math.round(cam.z / CHUNK_SIZE);

  // Add needed chunks
  for (let dx = -RENDER_DIST; dx <= RENDER_DIST; dx++) {
    for (let dz = -RENDER_DIST; dz <= RENDER_DIST; dz++) {
      const key = chunkKey(cgX + dx, cgZ + dz);
      if (!chunks.has(key)) {
        const chunk = buildChunk(cgX + dx, cgZ + dz);
        chunks.set(key, chunk);
      }
    }
  }

  // Remove far chunks
  for (const [key, chunk] of chunks) {
    if (
      Math.abs(chunk.gx - cgX) > RENDER_DIST + 1 ||
      Math.abs(chunk.gz - cgZ) > RENDER_DIST + 1
    ) {
      scene.remove(chunk.mesh);
      chunk.mesh.geometry.dispose();
      chunks.delete(key);
    }
  }
}

// ─── Stars ─────────────────────────────────────────────────────────────────────
function createStars(): THREE.Points {
  const count = 2000;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    const r = 200 + Math.random() * 150;
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    sizes[i] = Math.random() * 2 + 0.5;
  }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 1.2,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
  });

  return new THREE.Points(geo, mat);
}

const stars = createStars();
scene.add(stars);

// ─── Ground plane ──────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(1000, 1000);
const groundMat = new THREE.MeshPhongMaterial({
  color: 0x050518,
  shininess: 0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3;
scene.add(ground);

// ─── Lighting ──────────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x1a0a2e, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x7b2fff, 0.8);
dirLight.position.set(50, 100, 50);
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x00d4ff, 0.6, 200);
pointLight.position.set(0, 20, 0);
scene.add(pointLight);

// ─── Audio bars HUD ─────────────────────────────────────────────────────────────
const barsContainer = document.getElementById('audio-bars')!;
const barsEl: HTMLDivElement[] = [];

for (let i = 0; i < 8; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.style.height = '4px';
  bar.style.background = '#' + BAND_COLORS[i].getHexString();
  barsContainer.appendChild(bar);
  barsEl.push(bar);
}

// ─── Audio setup ───────────────────────────────────────────────────────────────
async function setupAudio(): Promise<void> {
  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.7;
  freqData = new Uint8Array(analyser.frequencyBinCount);

  // Expand input to handle different sample rates
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  const source = audioCtx.createMediaStreamSource(stream);
  source.connect(analyser);

  isAudioReady = true;

  // Pre-fill history
  for (let i = 0; i < BAND_WEIGHTS.length; i++) {
    audioHistory.push(new Array(HISTORY_LEN).fill(0));
  }

  document.getElementById('intro')!.classList.add('hidden');
  document.getElementById('hud')!.classList.add('visible');
  controls.lock();
}

// ─── Input handling ─────────────────────────────────────────────────────────────
document.getElementById('intro')!.addEventListener('click', () => {
  setupAudio().catch(console.error);
});

document.getElementById('pause')!.addEventListener('click', () => {
  controls.lock();
});

controls.addEventListener('lock', () => {
  document.getElementById('pause')!.classList.remove('visible');
});

controls.addEventListener('unlock', () => {
  document.getElementById('pause')!.classList.add('visible');
});

document.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'KeyW': keys.w = true; break;
    case 'KeyA': keys.a = true; break;
    case 'KeyS': keys.s = true; break;
    case 'KeyD': keys.d = true; break;
  }
});

document.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': keys.w = false; break;
    case 'KeyA': keys.a = false; break;
    case 'KeyS': keys.s = false; break;
    case 'KeyD': keys.d = false; break;
  }
});

// ─── Resize handler ────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Audio processing ─────────────────────────────────────────────────────────
const BAND_RANGES = [
  [0, 2],
  [2, 6],
  [6, 12],
  [12, 24],
  [24, 48],
  [48, 72],
  [72, 96],
  [96, 128],
];

function processAudio(): void {
  if (!isAudioReady) return;

  analyser.getByteFrequencyData(freqData);

  const bandVals: number[] = [];
  for (const [start, end] of BAND_RANGES) {
    let sum = 0;
    let count = 0;
    for (let i = start; i < end && i < freqData.length; i++) {
      sum += freqData[i];
      count++;
    }
    bandVals.push(count > 0 ? sum / count / 255 : 0);
  }

  // Push to history, maintaining rolling window
  for (let i = 0; i < bandVals.length; i++) {
    if (!audioHistory[i]) audioHistory[i] = new Array(HISTORY_LEN).fill(0);
    audioHistory[i].shift();
    audioHistory[i].push(bandVals[i]);
  }

  // Update HUD bars
  for (let i = 0; i < barsEl.length; i++) {
    barsEl[i].style.height = `${Math.max(4, bandVals[i] * 120)}px`;
  }

  // Update HUD coordinates
  const pos = camera.position;
  document.getElementById('coord-x')!.textContent = `X: ${pos.x.toFixed(0)}`;
  document.getElementById('coord-y')!.textContent = `Z: ${pos.z.toFixed(0)}`;

  // Update point light position to follow camera
  pointLight.position.set(pos.x, pos.y + 10, pos.z);

  // Update fog density based on spectral centroid proxy
  const centroid = bandVals.reduce((sum, v, i) => sum + v * i, 0) / (bandVals.reduce((a, b) => a + b, 0.001));
  scene.fog.density = 0.008 + centroid * 0.015;

  // Stars opacity
  const starMat = stars.material as THREE.PointsMaterial;
  starMat.opacity = 0.4 + centroid * 0.5;

  // Directional light color tint
  const bandColors = bandVals.map((v, i) => BAND_COLORS[i].clone().multiplyScalar(v));
  const avgColor = bandColors.reduce((c, col) => c.add(col), new THREE.Color(0, 0, 0));
  dirLight.color.copy(avgColor.multiplyScalar(2).add(new THREE.Color(0x7b2fff)));
}

// ─── Movement ─────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function updateMovement(delta: number): void {
  if (!controls.isLocked) return;

  velocity.x = 0;
  velocity.z = 0;

  direction.z = Number(keys.w) - Number(keys.s);
  direction.x = Number(keys.d) - Number(keys.a);
  direction.normalize();

  if (keys.w || keys.s) velocity.z = direction.z * MOVE_SPEED * delta;
  if (keys.a || keys.d) velocity.x = direction.x * MOVE_SPEED * delta;

  controls.moveRight(velocity.x);
  controls.moveForward(velocity.z);

  // Keep camera at fixed height
  controls.getObject().position.y = CAMERA_HEIGHT;
}

// ─── Render loop ────────────────────────────────────────────────────────────────
let lastChunkUpdate = 0;

function animate(): void {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const elapsed = clock.elapsedTime;

  processAudio();
  updateMovement(delta);
  updateChunks();

  // Animate stars slowly rotating
  stars.rotation.y = elapsed * 0.005;
  stars.rotation.x = Math.sin(elapsed * 0.003) * 0.05;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
